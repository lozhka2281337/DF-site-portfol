<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dwarf Fortress: About Me</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="topbar">
    <div class="group">
      <span class="title" id="topbar-title"></span>
      <span class="subtitle" id="topbar-subtitle"></span>
    </div>
    <div class="group" id="topbar-stats"></div>
    <div class="group">
      <span>FPS: <span class="hl" id="fps">—</span></span>
      <span id="cursor">[X: — Y: —]</span>
      <span class="subtitle" id="topbar-date"></span>
    </div>
  </div>

  <div id="game-area">
    <canvas id="game"></canvas>
    <div id="left-panel"></div>
    <button id="panel-toggle" title="Свернуть панель (Tab)">◀</button>
  </div>

  <script src="content.js"></script>
  <script src="config.js"></script>
  <script src="world.js"></script>
  <script src="render.js"></script>
  <script src="input.js"></script>
  <script src="main.js"></script>
</body>
</html>
